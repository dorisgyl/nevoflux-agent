# Cargo.toml (workspace root)

[package]
name = "nevoflux-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "NevoFlux Native Agent - AI-powered browser assistant"

[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/storage",
    "crates/llm",
    "crates/llm-gateway",
    "crates/testing",
    "crates/mcp",
    "crates/daemon",
    "crates/bridge",
    "crates/brain",
    "crates/skills",
    "crates/pack",
    "crates/computer",
    "crates/builtin-wasm",
    "crates/tts",
    "crates/rtc-transport",
    "crates/asr",
]
# Evaluation harnesses (see experiments/README.md). Excluded rather than left
# unlisted so the intent is on the record: they pull dependency trees that must
# not reach the daemon's build graph.
exclude = ["experiments"]

[workspace.package]
version = "0.3.15"
edition = "2021"
license = "AGPL-3.0"
repository = "https://github.com/nevoflux-browser/nevoflux-agent"

[workspace.dependencies]
# LLM Framework
rig-core = { version = "0.29", default-features = false, features = ["reqwest-rustls"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rmp-serde = "1"

# Error handling
thiserror = "2"

# Encryption (XChaCha20-Poly1305 for .nbrain knowledge-base sharing)
chacha20poly1305 = "0.10"

# Storage
rusqlite = { version = "0.32", features = ["bundled"] }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "process"] }
tokio-stream = "0.1"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "rustls-tls-native-roots"] }

# Async utilities
futures = "0.3"
async-trait = "0.1"

# Testing
proptest = "1"
test-case = "3"

# Mocking
mockall = "0.13"

# UUID
uuid = { version = "1", features = ["v4"] }

# Platform directories
directories = "5"

# Glob patterns
glob = "0.3"

# Regex engine (recipe pattern validation)
regex = "1.10"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# File locking
fs2 = "0.4"

# Wasmtime
wasmtime = "27"
wasmtime-wasi = "27"

[features]
default = ["embedding", "ort-load-dynamic", "tts-local", "tts-gpu", "asr-sensevoice", "asr-whisper"]
embedding = ["nevoflux-daemon/embedding"]
# Local Kokoro speech, forwarded to nevoflux-daemon.
tts-local = ["nevoflux-daemon/tts-local"]
# GPU execution providers for speech, forwarded to nevoflux-daemon.
#
# This forwarding is why they work at all. `nevoflux-daemon` is depended on
# with `default-features = false`, so its own default list is inert here and
# every feature it should have has to be named again in this file. `tts-gpu`
# was not, for as long as it has existed: the daemon probed for DirectML and
# CUDA at startup, and the binary answered "built without the ort-directml
# feature" every time, because it was. No release has ever shipped able to use
# a GPU. Adding a feature to a crate's own defaults does nothing until it is
# listed here too.
tts-gpu = ["nevoflux-daemon/tts-gpu"]
# Peer-to-peer transport for remote sessions, forwarded to nevoflux-daemon.
# Off by default: str0m pulls ~100 crates and the path is not proven on real
# networks yet. Without it every range takes the relay, as it does today.
#   cargo build --features webrtc
webrtc = ["nevoflux-daemon/webrtc"]
# Local SenseVoice transcription, forwarded to nevoflux-daemon.
asr-sensevoice = ["nevoflux-daemon/asr-sensevoice"]
# Whisper via Candle, forwarded to nevoflux-daemon. On by default; the
# default model is `base`, chosen for footprint. See the daemon manifest.
asr-whisper = ["nevoflux-daemon/asr-whisper"]
# ONNX Runtime linking strategy, forwarded to nevoflux-daemon. Pick one:
#   * ort-load-dynamic (default): load libonnxruntime at startup via
#     ORT_DYLIB_PATH or bundled next to the exe (runs on glibc >= 2.27).
#   * ort-download-binaries: statically link a prebuilt ONNX Runtime
#     (rc.12 needs glibc >= 2.38). Self-contained static build:
#       cargo build --no-default-features --features "embedding,ort-download-binaries"
ort-download-binaries = ["nevoflux-daemon/ort-download-binaries"]
ort-load-dynamic = ["nevoflux-daemon/ort-load-dynamic"]

[[bin]]
name = "nevoflux-agent"
path = "src/main.rs"

[dependencies]
nevoflux-daemon = { path = "crates/daemon", default-features = false }
nevoflux-bridge = { path = "crates/bridge" }
nevoflux-mcp = { path = "crates/mcp" }
nevoflux-skills = { path = "crates/skills" }
nevoflux-protocol = { path = "crates/protocol" }
nevoflux-storage = { path = "crates/storage" }
clap = { workspace = true }
clap_complete = "4"
serde_json = { workspace = true }
tokio = { workspace = true, features = ["signal"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
directories = { workspace = true }
fs2 = { workspace = true }
async-trait = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
serde_json = { workspace = true }
serial_test = "3"
assert_cmd = "2"
predicates = "3"
wat = "1"
tokio = { workspace = true }
futures = { workspace = true }
nevoflux-bridge = { path = "crates/bridge" }
nevoflux-computer = { path = "crates/computer" }
nevoflux-daemon = { path = "crates/daemon" }
nevoflux-llm = { path = "crates/llm" }
nevoflux-mcp = { path = "crates/mcp" }
nevoflux-protocol = { path = "crates/protocol" }
