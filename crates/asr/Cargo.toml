# crates/asr/Cargo.toml

[package]
name = "nevoflux-asr"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

description = "Local speech recognition (SenseVoice + Whisper) for NevoFlux Agent"

[features]
default = []
# SenseVoice: ONNX via `ort`, the default engine. Chinese and low latency.
sensevoice = ["dep:ort", "dep:ndarray"]
# Whisper (Candle) arrives with the engine itself; the dependencies are not
# declared until then. Candle is a second ML runtime and a large one, and
# carrying it in the manifest before anything calls it would put every build
# -- and every lockfile update -- behind a bet that has not been placed yet.
# ONNX Runtime linking strategy, forwarded to `ort`. Mirrors nevoflux-tts;
# see the workspace CLAUDE.md for why load-dynamic is the default there.
ort-download-binaries = ["ort?/download-binaries"]
ort-load-dynamic = ["ort?/load-dynamic"]

[dependencies]
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["ndarray", "std", "api-24"], optional = true }
ndarray = { version = "0.17", optional = true }
thiserror = { workspace = true }
dirs = "5.0"

[dev-dependencies]
tempfile = "3"
