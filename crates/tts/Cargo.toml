# crates/tts/Cargo.toml

[package]
name = "nevoflux-tts"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

description = "Local Kokoro-82M text-to-speech for NevoFlux Agent"

[features]
default = []
# ONNX Runtime linking strategy, forwarded to `ort`. Mirrors the split the
# embedding crates use; see the workspace CLAUDE.md for why load-dynamic is
# the default there.
ort-download-binaries = ["ort/download-binaries"]
ort-load-dynamic = ["ort/load-dynamic"]

[dependencies]
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["ndarray", "std", "api-24"] }
ndarray = "0.17"
misaki-rs = { version = "0.3.0", default-features = false }
zip = { version = "2", default-features = false, features = ["deflate"] }
thiserror = { workspace = true }
dirs = "5.0"
# The MOSS manifest carries the prompt templates and the built-in voices;
# without it the graphs have no way to be addressed.
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3"
