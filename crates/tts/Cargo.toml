# crates/tts/Cargo.toml

[package]
name = "nevoflux-tts"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

description = "Local Kokoro-82M text-to-speech for NevoFlux Agent"

[features]
default = []
# ONNX Runtime linking strategy, forwarded to `ort`. Mirrors the split the
# embedding crates use; see the workspace CLAUDE.md for why load-dynamic is
# the default there.
ort-download-binaries = ["ort/download-binaries"]
ort-load-dynamic = ["ort/load-dynamic"]
# GPU execution providers. Enabling them costs nothing at link time under
# `load-dynamic` -- they only add the API calls that attach a provider, and a
# runtime that does not carry that provider simply refuses, which is exactly
# the signal `crate::ep` selects on.
ort-cuda = ["ort/cuda"]
ort-directml = ["ort/directml"]
# Apple CoreML. Unlike the other two this needs no different runtime — the
# official macOS build already carries the provider — so on a Mac this is a
# GPU/neural-engine path that costs nothing to ship.
ort-coreml = ["ort/coreml"]

[dependencies]
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["ndarray", "std", "api-24"] }
ndarray = "0.17"
# 中文 G2P:分词 + 汉字转拼音。两个都是成熟的纯 Rust 实现,不引入 Python。
jieba-rs = "0.7"
pinyin = "0.10"
misaki-rs = { version = "0.3.0", default-features = false }
zip = { version = "2", default-features = false, features = ["deflate"] }
thiserror = { workspace = true }
# 音色回落必须留下痕迹。静默地换一副嗓子,和静默地不出声,是同一类毛病。
tracing = { workspace = true }
dirs = "5.0"
# The MOSS manifest carries the prompt templates and the built-in voices;
# without it the graphs have no way to be addressed.
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3"
